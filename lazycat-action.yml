version: 2
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/cloud.lazycat.app.c2fauth.lpk
  target_arch: amd64
source:
  kind: git
  url: https://github.com/Bubka/2FAuth.git
  select:
    strategy: semver-tag
    tag_regex: '^v[0-9]+\.[0-9]+\.[0-9]+$'
    exclude_regex: '(?i)(alpha|beta|rc)'
changelog:
  mode: github-release
  git_url: https://github.com/Bubka/2FAuth.git
state:
  file: .lazycat-action.lock.yml
update:
  strategy: publish
  allow_downgrade: false
build:
  run_buildscript: true
  prepare:
    mode: images
images:
  - id: 2fauth
    target: service
    service: 2fauth
    source: docker.io/2fauth/2fauth:{source_version}
    delivery:
      mode: lazycat
      copy_timeout: 30m
      copy_idle_timeout: 10m
stores:
  official:
    enabled: true
    create_if_missing: false
    skip_if_version_exists: true
    continue_if_newer_version: true
